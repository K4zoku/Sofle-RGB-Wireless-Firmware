# Enable the encoder driver used by this shield.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_LED_PWM=y
CONFIG_ZMK_BACKLIGHT_BRT_START=20
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

CONFIG_ZMK_KEYBOARD_NAME="PiparFlake"
CONFIG_USB_DEVICE_MANUFACTURER="koit.dev"

# The shield supplies the generic VIA matrix adapter in its keymap.
CONFIG_ZMK_VIA_ENCODER_READ=y
CONFIG_ZMK_VIA=y
CONFIG_ZMK_BEHAVIOR_METADATA=y
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE=y
CONFIG_ZMK_KEYMAP_LAYER_REORDERING=y
